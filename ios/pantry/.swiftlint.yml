# SwiftLint configuration for Pantry iOS app
# Install: brew install swiftlint
# Run: swiftlint lint --path pantry

# Only lint the main source directory
included:
  - pantry

excluded:
  - pantryTests
  - pantryUITests

# Rules configuration
disabled_rules:
  - trailing_comma              # Trailing commas are fine in SwiftUI
  - identifier_name             # SwiftUI uses short names like `id`, `vm`
  - type_body_length            # Views can be long
  - file_length                 # ViewModels can be long
  - function_body_length        # SwiftUI body properties can be complex
  - line_length                 # SwiftUI modifiers chain long
  - nesting                     # SwiftUI previews nest types
  - opening_brace               # Conflicts with some SwiftUI patterns
  - multiple_closures_with_trailing_closure  # Common in SwiftUI Button(action:) { }

opt_in_rules:
  - empty_count                 # Prefer isEmpty over count == 0
  - empty_string                # Prefer isEmpty over == ""
  - first_where                 # Prefer first(where:) over filter().first
  - last_where                  # Prefer last(where:) over filter().last
  - sorted_first_last           # Prefer min()/max() over sorted().first/last
  - contains_over_first_not_nil # Prefer contains over first != nil
  - flatmap_over_map_reduce     # Prefer flatMap over map().reduce()
  - toggle_bool                 # Prefer toggle() over = !
  - joined_default_parameter    # Prefer joined() over joined(separator: "")
  - redundant_nil_coalescing    # Remove ?? nil
  - force_unwrapping            # Warn on force unwraps

# Customize specific rules
force_cast:
  severity: warning             # Warn instead of error

force_try:
  severity: warning             # Warn instead of error

force_unwrapping:
  severity: warning             # Warn instead of error

cyclomatic_complexity:
  warning: 15
  error: 25

function_parameter_count:
  warning: 6
  error: 8

large_tuple:
  warning: 3
  error: 4

# Reporter type (console for CLI)
reporter: "xcode"
